.55,.28],clouds:.22},beam:.07,\n  chord:[196,246.94,329.63,392],noise:[700,.05],grade:{shadow:[.9,.98,1.08],high:[1.05,1.0,.94],vig:.6}};\n\nimport * as THREE from 'three';\nimport {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';\nimport {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';\nimport {RenderPass} from 'three/addons/postprocessing/RenderPass.js';\nimport {OutputPass} from 'three/addons/postprocessing/OutputPass.js';\nimport {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';\n\nconst $=s=>document.querySelector(s);\nconst stage=$('#stage'),canvas=$('#gl');\nconst REDUCED=matchMedia('(prefers-reduced-motion:reduce)').matches;\n\n/* ---------- renderer ---------- */\nlet renderer;\ntry{renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'})}catch(e){$('#nogl').style.display='flex';throw e}\nlet DPR=Math.min(devicePixelRatio||1,1.5);\nrenderer.setPixelRatio(DPR);\nrenderer.setSize(innerWidth,innerHeight,false);\nrenderer.shadowMap.enabled=true;\nrenderer.shadowMap.type=THREE.PCFSoftShadowMap;\nrenderer.toneMapping=THREE.ACESFilmicToneMapping;\nrenderer.toneMappingExposure=CFG.exposure??.92;\nrenderer.outputColorSpace=THREE.SRGBColorSpace;\n\nconst scene=new THREE.Scene();\nscene.background=new THREE.Color(CFG.bg);\nscene.fog=new THREE.FogExp2(CFG.fog[0],CFG.fog[1]);\nconst camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.25,300);\nconst pmrem=new THREE.PMREMGenerator(renderer);\nscene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;\n\n/* ---------- textures ---------- */\nfunction cvs(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t}\nconst rnd=(a,b)=>a+Math.random()*(b-a);\nfunction woodTex(base,var_,planks=6){return cvs(1024,1024,(g,w,h)=>{\n  const ph=h/planks;\n  for(let i=0;i<planks;i++){const llStyle='rgba(255,255,255,.3)';for(let y=84;y<h;y+=116)g.fillRect(0,y,w,6);\n  for(let y=30;y<h;y+=58)for(let x=24;x<w;x+=62){const on=Math.random()<lit;g.fillStyle=on?(night?'#ffd59a':'#f6f1e2'):(night?'#1c2a3c':'#7d98a6');g.globalAlpha=.9;g.fillRect(x,y,40,34);g.globalAlpha=1}})}\n\n/* ---------- materials ---------- */\nconst M=(color,o={})=>new THREE.MeshStandardMaterial({color,roughness:.82,metalness:0,envMapIntensity:.42,flatShading:true,...o});\nconst tex=(t,rx,ry)=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);return t};\nconst mats={\n  oak:M('#ffffff',{map:tex(woodTex('#d9c3a3',.04,4),1,1),roughness:.5}),\n  darkoak:M('#ffffff',{map:tex(woodTex('#9a7a5c',.04,5),1,1),roughness:.55}),\n  steel:M('#3f5a5c',{roughness:.45,metalness:.35}),\n  white:M('#fbfbf8',{roughness:.28,envMapIntensity:.9}),\n  chrome:M('#e8ecee',{roughness:.18,metalness:1,envMapIntensity:1.2}),\n  stone:M('#eef0ee',{roughness:.35}),\n  leaf:M('#6f9f6a',{roughness:.7,side:THREE.DoubleSide}),\n  leaf2:M('#8bb67d',{roughness:.7,side:THREE.DoubleSide}),\n  pot:M('#e7ddd0',{roughness:.85}),\n  terracotta:M('#d39a7a',{roughness:.9}),\n  paper:M('#ffffff',{map:paperTex(),roughness:.9,side:THREE.DoubleSide}),\n  lampshade:M('#f1ece2',{roughness:.6,side:THREE.DoubleSide}),\n  bulb:new THREE.MeshStandardMaterial({color:'#fff2d8',emissive:'#ffd59a',emissiveIntensity:5}),\n  glass:new THREE.MeshPhysicalMaterial({color:'#e6f2f6',roughness:.04,metalness:0,transparent:true,opacity:.1,envMapIntensity:1.5,depthWrite:false}),\n  jar:new THREE.MeshPhysicalMaterial({color:'#dff0ee',roughness:.1,transparent:true,opacity:.35,envMapIntensity:1.4,depthWrite:false}),\n  screen:new THREE.MeshStandardMaterial({color:'#0e1418',emissive:'#9fc7e0',emissiveIntensity:.55,roughness:.2}),\n  phoneBody:M('#22262b',{roughness:.3,metalness:.3}),\n  paperCup:M('#f4efe6',{roughness:.8}),\n};\n\n/* ---------- helpers ---------- */\nconst Y=new THREE.Vector3(0,1,0);\nfunction add(parent,geo,mat,x=0,y=0,z=0,o={}){cons nction facadeTex(base,lit=.18,night=false){return cvs(512,1024,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);g.fillStyle='rgba(255,255,255,.3)';for(let y=84;y<h;y+=116)g.fillRect(0,y,w,6);\n  for(let y=30;y<h;y+=58)for(let x=24;x<w;x+=62){const on=Math.random()<lit;g.fillStyle=on?(night?'#ffd59a':'#f6f1e2'):(night?'#1c2a3c':'#7d98a6');g.globalAlpha=.9;g.fillRect(x,y,40,34);g.globalAlpha=1}})}\n\n/* ---------- materials ---------- */\nconst M=(color,o={})=>new THREE.MeshStandardMaterial({color,roughness:.82,metalness:0,envMapIntensity:.42,flatShading:true,...o});\nconst tex=(t,rx,ry)=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);return t};\nconst mats={\n  oak:M('#ffffff',{map:tex(woodTex('#d9c3a3',.04,4),1,1),roughness:.5}),\n  darkoak:M('#ffffff',{map:tex(woodTex('#9a7a5c',.04,5),1,1),roughness:.55}),\n  steel:M('#3f5a5c',{roughness:.45,metalness:.35}),\n  white:M('#fbfbf8',{roughness:.28,envMapIntensity:.9}),\n  chrome:M('#e8ecee',{roughness:.18,metalness:1,envMapIntensity:1.2}),\n  stone:M('#eef0ee',{roughness:.35}),\n  leaf:M('#6f9f6a',{roughness:.7,side:THREE.DoubleSide}),\n  leaf2:M('#8bb67d',{roughness:.7,side:THREE.DoubleSide}),\n  pot:M('#e7ddd0',{roughness:.85}),\n  terracotta:M('#d39a7a',{roughness:.9}),\n  paper:M('#ffffff',{map:paperTex(),roughness:.9,side:THREE.DoubleSide}),\n  lampshade:M('#f1ece2',{roughness:.6,side:THREE.DoubleSide}),\n  bulb:new THREE.MeshStandardMaterial({color:'#fff2d8',emissive:'#ffd59a',emissiveIntensity:5}),\n  glass:new THREE.MeshPhysicalMaterial({color:'#e6f2f6',roughness:.04,metalness:0,transparent:true,opacity:.1,envMapIntensity:1.5,depthWrite:false}),\n  jar:new THREE.MeshPhysicalMaterial({color:'#dff0ee',roughness:.1,transparent:true,opacity:.35,envMapIntensity:1.4,depthWrite:false}),\n  screen:new THREE.MeshStandardMaterial({color:'#0e1418',emissive:'#9fc7e0',emissiveIntensity:.55,roughness:.2}),\n  phoneBody:M('#22262b',{roughness:.3,metalness:.3}),\n  paperCup:M('#f4efe6',{roughness:.8}),\n};\n\n/* ---------- helpers ---------- */\nconst Y=new THREE.Vector3(0,1,0);\nfunction add(parent,geo,mat,x=0,y=0,z=0,o={}){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);if(o.rx)m.rotation.x=o.rx;if(o.ry)m.rotation.y=o.ry;if(o.rz)m.rotation.z=o.rz;if(o.s)m.scale.set(...o.s);parent.add(m);return m}\nfunction capsule(parent,a,b,r,mat,seg=6){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b);const len=A.distanceTo(B);\n  const m=new THREE.Mesh(new THREE.CylinderGeometry(r*.92,r,Math.max(len,.001)+r*.6,seg),mat);m.position.copy(A).add(B).multiplyScalar(.5);\n  m.quaternion.setFromUnitVectors(Y,B.clone().sub(A).normalize());parent.add(m);return m}\nconst rbox=(w,h,d)=>new THREE.BoxGeometry(w,h,d);\nconst V=(x,y,z)=>new THREE.Vector3(x,y,z);\nconst FX=[];const TICK=[];\n\n/* ---------- sky + sun ---------- */\nconst sunDir=new THREE.Vector3(...CFG.sun.dir).normalize();\nconst SK=CFG.sky||{hor:[.86,.93,.96],zen:[.42,.66,.88],glow:[1,.93,.8],clouds:.45};\nconst sky=new THREE.Mesh(new THREE.SphereGeometry(150,16,10),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,\n  uniforms:{sun:{value:sunDir}},\n  vertexShader:`varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,\n  fragmentShader:`varying vec3 vD;uniform vec3 sun;void main(){float h=clamp(vD.y,0.,1.);vec3 hor=vec3(${SK.hor}),zen=vec3(${SK.zen});\n   vec3 c=mix(hor,zen,pow(h,.55));float s=max(dot(normalize(vD),sun),0.);c+=vec3(${SK.glow})*(pow(s,8.)*.35+pow(s,200.)*1.5);\n   float cl=smoothstep(.55,.9,sin(vD.x*9.+vD.z*4.)*.5+.5+sin(vD.z*13.-vD.x*3.)*.25)*smoothstep(.05,.25,h)*(1.-smoothstep(.4,.7,h));c=mix(c,vec3(1.),cl*${(SK.clouds??.45).toFixed(2)});\n   gl_FragColor=vec4(c,1.);}`}));\nscene.add(sky);\nconst hemi=new THREE.HemisphereLight(...CFG.hemi);scene.add(hemi);\nconst sun=new THREE.DirectionalLight(CFG.sun.color,CFG.sun.int);\n{const c=new THREE.Vector3(...(CFG.shadow?.c||[0,.7,0])),r=CFG.shadow?.r||7;\n sun.position.copy(s m()*(b-a);\nfunction woodTex(base,var_,planks=6){return cvs(1024,1024,(g,w,h)=>{\n  const ph=h/planks;\n  for(let i=0;i<planks;i++){const c=new THREE.Color(base);c.offsetHSL(rnd(-.01,.01),rnd(-.04,.04),rnd(-var_,var_));g.fillStyle='#'+c.getHexString();g.fillRect(0,i*ph,w,ph);\n    g.globalAlpha=.12;for(let k=0;k<26;k++){g.strokeStyle=Math.random()<.5?'#6b5640':'#fff6e8';g.lineWidth=rnd(.6,2.2);g.beginPath();const y0=i*ph+rnd(2,ph-2),a=rnd(1,4),f=rnd(.004,.012),p=rnd(0,9);\n      for(let x=0;x<=w;x+=16){const y=y0+Math.sin(x*f+p)*a;x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}\n    g.globalAlpha=1;g.fillStyle='rgba(60,45,30,.22)';g.fillRect(0,i*ph,w,2);\n    const cut=rnd(.2,.8)*w;g.fillRect(cut,i*ph,2,ph)}})}\nfunction plasterTex(base){return cvs(512,512,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);\n  for(let i=0;i<9000;i++){g.fillStyle=Math.random()<.5?'rgba(255,255,255,.05)':'rgba(70,90,90,.045)';const r=rnd(.5,2.4);g.fillRect(rnd(0,w),rnd(0,h),r,r)}\n  for(let i=0;i<40;i++){g.fillStyle=`rgba(255,255,255,${rnd(.01,.035)})`;g.beginPath();g.ellipse(rnd(0,w),rnd(0,h),rnd(20,90),rnd(10,40),rnd(0,3),0,7);g.fill()}})}\nfunction concreteTex(base){return cvs(1024,1024,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);\n  for(let i=0;i<60;i++){g.fillStyle=`rgba(${Math.random()<.5?'255,255,255':'60,70,75'},${rnd(.015,.04)})`;g.beginPath();g.ellipse(rnd(0,w),rnd(0,h),rnd(40,200),rnd(30,120),rnd(0,3),0,7);g.fill()}\n  for(let i=0;i<14000;i++){g.fillStyle=Math.random()<.5?'rgba(255,255,255,.04)':'rgba(40,50,55,.04)';g.fillRect(rnd(0,w),rnd(0,h),rnd(.5,2),rnd(.5,2))}\n  g.strokeStyle='rgba(40,50,55,.16)';g.lineWidth=2;for(let x=0;x<=w;x+=256){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke()}for(let y=0;y<=h;y+=256){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}})}\nfunction paperTex(){return cvs(256,512,(g,w,h)=>{g.fillStyle='#fbfaf6';g.fillRect(0,0,w,h);g.fillStyle='#9aa3a8';\n  for(let y=60;y<h-40;y+=34){g.fillRect(30,y,rnd(80,150),7);g.fillRect(w-70,y,40,7)}g.fillRect(30,h-60,w-60,3)})}\nfunction facadeTex(base,lit=.18,night=false){return cvs(512,1024,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);g.fillStyle='rgba(255,255,255,.3)';for(let y=84;y<h;y+=116)g.fillRect(0,y,w,6);\n  for(let y=30;y<h;y+=58)for(let x=24;x<w;x+=62){const on=Math.random()<lit;g.fillStyle=on?(night?'#ffd59a':'#f6f1e2'):(night?'#1c2a3c':'#7d98a6');g.globalAlpha=.9;g.fillRect(x,y,40,34);g.globalAlpha=1}})}\n\n/* ---------- materials ---------- */\nconst M=(color,o={})=>new THREE.MeshStandardMaterial({color,roughness:.82,metalness:0,envMapIntensity:.42,flatShading:true,...o});\nconst tex=(t,rx,ry)=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);return t};\nconst mats={\n  oak:M('#ffffff',{map:tex(woodTex('#d9c3a3',.04,4),1,1),roughness:.5}),\n  darkoak:M('#ffffff',{map:tex(woodTex('#9a7a5c',.04,5),1,1),roughness:.55}),\n  steel:M('#3f5a5c',{roughness:.45,metalness:.35}),\n  white:M('#fbfbf8',{roughness:.28,envMapIntensity:.9}),\n  chrome:M('#e8ecee',{roughness:.18,metalness:1,envMapIntensity:1.2}),\n  stone:M('#eef0ee',{roughness:.35}),\n  leaf:M('#6f9f6a',{roughness:.7,side:THREE.DoubleSide}),\n  leaf2:M('#8bb67d',{roughness:.7,side:THREE.DoubleSide}),\n  pot:M('#e7ddd0',{roughness:.85}),\n  terracotta:M('#d39a7a',{roughness:.9}),\n  paper:M('#ffffff',{map:paperTex(),roughness:.9,side:THREE.DoubleSide}),\n  lampshade:M('#f1ece2',{roughness:.6,side:THREE.DoubleSide}),\n  bulb:new THREE.MeshStandardMaterial({color:'#fff2d8',emissive:'#ffd59a',emissiveIntensity:5}),\n  glass:new THREE.MeshPhysicalMaterial({color:'#e6f2f6',roughness:.04,metalness:0,transparent:true,opacity:.1,envMapIntensity:1.5,depthWrite:false}),\n  jar:new THREE.MeshPhysicalMaterial({color:'#dff0ee',roughness:.1,transparent:true,opacity:.35,envMapIntensity:1.4,depthWrite:false}),\n  screen:new THREE.MeshStandardMaterial({color:'#0e1418',emissive:'#9fc7e0',emissiveIntensity:.55,roughness:.2}),\n  phoneBody:M('#22262b',{roughness:.3,metalness:.3}),\n  paperCup:M('#f4efe6',{roughness:.8}),\n};\n\n/* ---------- helpers ---------- */\nconst Y=new THREE.Vector3(0,1,0);\nfunction add(parent,geo,mat,x=0,y=0,z=0,o={}){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);if(o.rx)m.rotation.x=o.rx;if(o.ry)m.rotation.y=o.ry;if(o.rz)m.rotation.z=o.rz;if(o.s)m.scale.set(...o.s);parent.add(m);return m}\nfunction capsule(parent,a,b,r,mat,seg=6){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b);const len=A.distanceTo(B);\n  const m=new THREE.Mesh(new THREE.CylinderGeometry(r*.92,r,Math.max(len,.001)+r*.6,seg),mat);m.position.copy(A).add(B).multiplyScalar(.5);\n  m.quaternion.setFromUnitVectors(Y,B.clone().sub(A).normalize());parent.add(m);return m}\nconst rbox=(w,h,d)=>new THREE.BoxGeometry(w,h,d);\nconst V=(x,y,z)=>new THREE.Vector3(x,y,z);\nconst FX=[];const TICK=[];\n\n/* ---------- sky + sun ---------- */\nconst sunDir=new THREE.Vector3(...CFG.sun.dir).normalize();\nconst SK=CFG.sky||{hor:[.86,.93,.96],zen:[.42,.66,.88],glow:[1,.93,.8],clouds:.45};\nconst sky=new THREE.Mesh(new THREE.SphereGeometry(150,16,10),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,\n  uniforms:{sun:{value:sunDir}},\n  vertexShader:`varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,\n  fragmentShader:`varying vec3 vD;uniform vec3 sun;void main(){float h=clamp(vD.y,0.,1.);vec3 hor=vec3(${SK.hor}),zen=vec3(${SK.zen});\n   vec3 c=mix(hor,zen,pow(h,.55));float s=max(dot(normalize(vD),sun),0.);c+=vec3(${SK.glow})*(pow(s,8.)*.35+pow(s,200.)*1.5);\n   float cl=smoothstep(.55,.9,sin(vD.x*9.+vD.z*4.)*.5+.5+sin(vD.z*13.-vD.x*3.)*.25)*smoothstep(.05,.25,h)*(1.-smoothstep(.4,.7,h));c=mix(c,vec3(1.),cl*${(SK.clouds??.45).toFixed(2)});\n   gl_FragColor=vec4(c,1.);}`}));\nscene.add(sky);\nconst hemi=new THREE.HemisphereLight(...CFG.hemi);scene.add(hemi);\nconst sun=new THREE.DirectionalLight(CFG.sun.color,CFG.sun.int);\n{const c=new THREE.Vector3(...(CFG.shadow?.c||[0,.7,0])),r=CFG.shadow?.r||7;\n sun.position.copy(sunDir).multiplyScalar(r*2+4).add(c);sun.target.position.copy(c);\n sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);\n Object.assign(sun.shadow.camera,{left:-r,right:r,top:r,bottom:-r,near:.5,far:r*4+10});sun.shadow.bias=-.0004;sun.shadow.normalBias=.02;sun.shadow.radius=3}\nscene.add(sun,sun.target);\n\n/* ---------- reusable props ---------- */\nconst leafGeo=(()=>{const s=new THREE.Shape();s.moveTo(0,0);s.bezierCurveTo(.06,.04,.07,.13,0,.2);s.bezierCurveTo(-.07,.13,-.06,.04,0,0);return new THREE.ShapeGeometry(s,2)})();\nfunction plant(x,y,z,scale=1,n=26,potR=.16,potMat){const g=new THREE.Group();g.position.set(x,y,z);g.scale.setScalar(scale);scene.add(g);\n  add(g,new THREE.CylinderGeometry(potR,potR*.8,potR*1.6,12,1,true),potMat||M('#e7ddd0',{roughness:.85,side:THREE.DoubleSide}),0,potR*.8,0);\n  add(g,new THREE.CylinderGeometry(potR*.8,potR*.8,.01,12),mats.pot,0,.005,0);\n  add(g,new THREE.CylinderGeometry(potR*.94,potR*.94,.02,12),M('#5a4636'),0,potR*1.38,0);\n  for(let i=0;i<n;i++){const a=i*2.4,h=rnd(.25,.8),r=rnd(.05,.28);const top=new THREE.Vector3(Math.cos(a)*r,potR*1.6+h,Math.sin(a)*r);\n    capsule(g,[0,potR*1.5,0],top.toArray(),.006,mats.leaf);\n    const L=add(g,leafGeo,i%3?mats.leaf:mats.leaf2,top.x,top.y,top.z);L.scale.setScalar(rnd(1.2,2));L.rotation.set(rnd(-1.2,-.3),a+Math.PI/2,rnd(-.4,.4))}\n  return g}\nfunction pendant(x,y,z,ceil,int=1.1,col='#ffcf98',shade=mats.lampshade,r=.17){const g=new THREE.Group();g.position.set(x,y,z);scene.add(g);\n  capsule(g,[0,.02,0],[0,ceil-y,0],.004,M('#2a2a2a'));\n  add(g,new THREE.SphereGeometry(r,12,8,0,Math.PI*2,0,Math.PI*.42),shade,0,-.04,0,{s:[1,.9,1]});\n  add(g,new THREE.SphereGeometry(r*.26,12,8),mats.bulb,0,-.06,0);\n  if(int>0){const pl=new THREE.PointLight(col,int,3.4,2);pl.position.set(0,-.12,0);g.add(pl)}return g}\nconst crownGeo=new THREE.IcosahedronGeometry(1,0);\nfunction tree(parent,x,z,r,dens=70,y0=0){add(parent,new THREE.CylinderGeometry(.09*r,.14*r,r*2.6,8),M('#7a6 2=\"0\" y2=\"0\"/><text text-anchor=\"middle\"><\/text><\/svg><\/div>\n  <div id=\"labels\"><\/div>\n  <div id=\"lensTitle\">Where the day went<small>Click anywhere to return<\/small><\/div>\n  <div id=\"top\">\n    <div id=\"place\"><b>23:40<\/b> · Home<\/div>\n    <div id=\"tools\">\n      <div class=\"tools-row\"><button class=\"pill\" id=\"lensBtn\" aria-pressed=\"false\" title=\"Show who holds the data (L)\">Data lens<\/button><button class=\"pill\" id=\"sound\" aria-pressed=\"true\">Sound on<\/button><\/div>\n      <div id=\"counter\">Data left behind<b id=\"countN\">0<\/b><\/div>\n    <\/div>\n  <\/div>\n  <div id=\"toast\" role=\"status\"><\/div>\n  <div id=\"inspect\" hidden><\/div>\n  <div id=\"hud\" aria-live=\"polite\"><\/div>\n  <div id=\"bottom\">\n    <div id=\"choices\"><\/div>\n    <div id=\"sub\" class=\"hide\" aria-live=\"polite\"><span class=\"who\"><\/span><div class=\"line\"><\/div><\/div>\n    <div id=\"next\">Click or press space<\/div>\n  <\/div>\n  <div id=\"start\" class=\"overlay\">\n    <div class=\"eyebrow\">Friday, 18 May 2046 · 23:40<\/div>\n    <h1>Night <i>review<\/i><\/h1>\n    <p>The flat is quiet. Before she sleeps, her glasses show her the day they kept.<\/p>\n    <button class=\"go\" id=\"goBtn\" disabled>Sit down<\/button>\n    <div id=\"loading\">Dimming the lamp…<\/div>\n    \n  <\/div>\n  <div id=\"endcard\" class=\"overlay gone\" aria-hidden=\"true\">\n    <div class=\"n\">Epilogue<\/div>\n    <h2>Deleting your local copy leaves every external copy—and every model trained on it—intact.<\/h2>\n    <div class=\"chips\"><span class=\"chip\">Zuboff · behavioural surplus<\/span><span class=\"chip\">Couldry &amp; Mejias · data colonialism<\/span><span class=\"chip\">Viljoen · data as relation<\/span><span class=\"chip\">L1 – L8<\/span><\/div>\n    <div class=\"nav\"><button class=\"go ghost\" id=\"again\">Review again<\/button><a class=\"go\" href=\"morning3d.html\">Start the day again →<\/a><\/div>\n  <\/div>\n  <div id=\"bootfx\"><\/div>\n  <div id=\"fade\"><\/div>\n  <div id=\"nogl\"><p>This scene needs WebGL. Try a recent Chrome, Safari or Edge on a laptop.<\/p><\/div>\n<\/div>\n<script type=\"module\">\n//@@CFG\nconst CFG={id:'night',bg:'#121a29',fog:['#182136',.008],exposure:.62,home:{night:true,lamp:6,kitchen:0,litMin:.06,litMax:.18},\n  sun:{dir:[1,.38,-.3],color:'#6d86c4',int:.9},hemi:['#ffcfa0','#221a18',.12],shadow:{c:[0,1,-1],r:6},\n  sky:{hor:[.16,.2,.34],zen:[.04,.06,.16],glow:[.5,.42,.5],clouds:.08},beam:.0,\n  chord:[146.83,220,261.63,329.63],noise:[250,.05],grade:{shadow:[.88,.94,1.12],high:[1.08,1.0,.9],vig:.5}};\n\nimport * as THREE from 'three';\nimport {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';\nimport {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';\nimport {RenderPass} from 'three/addons/postprocessing/RenderPass.js';\nimport {OutputPass} from 'three/addons/postprocessing/OutputPass.js';\nimport {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';\n\nconst $=s=>document.querySelector(s);\nconst stage=$('#stage'),canvas=$('#gl');\nconst REDUCED=matchMedia('(prefers-reduced-motion:reduce)').matches;\n\n/* ---------- renderer ---------- */\nlet renderer;\ntry{renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'})}catch(e){$('#nogl').style.display='flex';throw e}\nlet DPR=Math.min(devicePixelRatio||1,1.5);\nrenderer.setPixelRatio(DPR);\nrenderer.setSize(innerWidth,innerHeight,false);\nrenderer.shadowMap.enabled=true;\nrenderer.shadowMap.type=THREE.PCFSoftShadowMap;\nrenderer.toneMapping=THREE.ACESFilmicToneMapping;\nrenderer.toneMappingExposure=CFG.exposure??.92;\nrenderer.outputColorSpace=THREE.SRGBColorSpace;\n\nconst scene=new THREE.Scene();\nscene.background=new THREE.Color(CFG.bg);\nscene.fog=new THREE.FogExp2(CFG.fog[0],CFG.fog[1]);\nconst camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.25,300);\nconst pmrem=new THREE.PMREMGenerator(renderer);\nscene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;\n\n/* ---------- textures ---------- */\nfunction cvs(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t}\nconst rnd=(a,b)=>a+Math.random()*(b-a);\nfunction woodTex(base,var_,planks=6){return cvs(1024,1024,(g,w,h)=>{\n  const ph=h/planks;\n  for(let i=0;i<planks;i++){const c=new THREE.Color(base);c.offsetHSL(rnd(-.01,.01),rnd(-.04,.04),rnd(-var_,var_));g.fillStyle='#'+c.getHexString();g.fillRect(0,i*ph,w,ph);\n    g.globalAlpha=.12;for(let k=0;k<26;k++){g.strokeStyle=Math.random()<.5?'#6b5640':'#fff6e8';g.lineWidth=rnd(.6,2.2);g.beginPath();const y0=i*ph+rnd(2,ph-2),a=rnd(1,4),f=rnd(.004,.012),p=rnd(0,9);\n      for(let x=0;x<=w;x+=16){const y=y0+Math.sin(x*f+p)*a;x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}\n    g.globalAlpha=1;g.fillStyle='rgba(60,45,30,.22)';g.fillRect(0,i*ph,w,2);\n    const cut=rnd(.2,.8)*w;g.fillRect(cut,i*ph,2,ph)}})}\nfunction plasterTex(base){return cvs(512,512,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);\n  for(let i=0;i<9000;i++){g.fillStyle=Math.random()<.5?'rgba(255,255,255,.05)':'rgba(70,90,90,.045)';const r=rnd(.5,2.4);g.fillRect(rnd(0,w),rnd(0,h),r,r)}\n  for(let i=0;i<40;i++){g.fillStyle=`rgba(255,255,255,${rnd(.01,.035)})`;g.beginPath();g.ellipse(rnd(0,w),rnd(0,h),rnd(20,90),rnd(10,40),rnd(0,3),0,7);g.fill()}})}\nfunction concreteTex(base){return cvs(1024,1024,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);\n  for(let i=0;i<60;i++){g.fillStyle=`rgba(${Math.random()<.5?'255,255,255':'60,70,75'},${rnd(.015,.04)})`;g.beginPath();g.ellipse(rnd(0,w),rnd(0,h),rnd(40,200),rnd(30,120),rnd(0,3),0,7);g.fill()}\n  for(let i=0;i<14000;i++){g.fillStyle=Math.random()<.5?'rgba(255,255,255,.04)':'rgba(40,50,55,.04)';g.fillRect(rnd(0,w),rnd(0,h),rnd(.5,2),rnd(.5,2))}\n  g.strokeStyle='rgba(40,50,55,.16)';g.lineWidth=2;for(let x=0;x<=w;x+=256){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke()}for(let y=0;y<=h;y+=256){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}})}\nfunction paperTex(){return cvs(256,512,(g,w,h)=>{g.fillStyle='#fbfaf6';g.fillRect(0,0,w,h);g.fillStyle='#9aa3a8';\n  for(let y=60;y<h-40;y+=34){g.fillRect(30,y,rnd(80,150),7);g.fillRect(w-70,y,40,7)}g.fillRect(30,h-60,w-60,3)})}\nfunction facadeTex(base,lit=.18,night=false){return cvs(512,1024,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);g.fillStyle='rgba(255,255,255,.3)';for(let y=84;y<h;y+=116)g.fillRect(0,y,w,6);\n  for(let y=30;y<h;y+=58)for(let x=24;x<w;x+=62){const on=Math.random()<lit;g.fillStyle=on?(night?'#ffd59a':'#f6f1e2'):(night?'#1c2a3c':'#7d98a6');g.globalAlpha=.9;g.fillRect(x,y,40,34);g.globalAlpha=1}})}\n\n/* ---------- materials ---------- */\nconst M=(color,o={})=>new THREE.MeshStandardMaterial({color,roughness:.82,metalness:0,envMapIntensity:.42,flatShading:true,...o});\nconst tex=(t,rx,ry)=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);return t};\nconst mats={\n  oak:M('#ffffff',{map:tex(woodTex('#d9c3a3',.04,4),1,1),roughness:.5}),\n  darkoak:M('#ffffff',{map:tex(woodTex('#9a7a5c',.04,5),1,1),roughness:.55}),\n  steel:M('#3f5a5c',{roughness:.45,metalness:.35}),\n  white:M('#fbfbf8',{roughness:.28,envMapIntensity:.9}),\n  chrome:M('#e8ecee',{roughness:.18,metalness:1,envMapIntensity:1.2}),\n  stone:M('#eef0ee',{roughness:.35}),\n  leaf:M('#6f9f6a',{roughness:.7,side:THREE.DoubleSide}),\n  leaf2:M('#8bb67d',{roughness:.7,side:THREE.DoubleSide}),\n  pot:M('#e7ddd0',{roughness:.85}),\n  terracotta:M('#d39a7a',{roughness:.9}),\n  paper:M('#ffffff',{map:paperTex(),roughness:.9,side:THREE.DoubleSide}),\n  lampshade:M('#f1ece2',{roughness:.6,side:THREE.DoubleSide}),\n  bulb:new THREE.MeshStandardMaterial({color:'#fff2d8',emissive:'#ffd59a',emissiveIntensity:5}),\n  glass:new THREE.MeshPhysicalMaterial({color:'#e6f2f6',roughness:.04,metalness:0,transparent:true,opacity:.1,envMapIntensity:1.5,depthWrite:false}),\n  jar:new THREE.MeshPhysicalMaterial({color:'#dff0ee',roughness:.1,transparent:true,opacity:.35,envMapIntensity:1.4,depthWrite:false}),\n  screen:new THREE.MeshStandardMaterial({color:'#0e1418',emissive:'#9fc7e0',emissiveIntensity:.55,roughness:.2}),\n  phoneBody:M('#22262b',{roughness:.3,metalness:.3}),\n  paperCup:M('#f4efe6',{roughness:.8}),\n};\n\n/* ---------- helpers ---------- */\nconst Y=new THREE.Vector3(0,1,0);\nfunction add(parent,geo,mat,x=0,y=0,z=0,o={}){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);if(o.rx)m.rotation.x=o.rx;if(o.ry)m.rotation.y=o.ry;if(o.rz)m.rotation.z=o.rz;if(o.s)m.scale.set(...o.s);parent.add(m);return m}\nfunction capsule(parent,a,b,r,mat,seg=6){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b);const len=A.distanceTo(B);\n  const m=new THREE.Mesh(new THREE.CylinderGeometry(r*.92,r,Math.max(len,.001)+r*.6,seg),mat);m.position.copy(A).add(B).multiplyScalar(.5);\n  m.quaternion.setFromUnitVectors(Y,B.clone().sub(A).normalize());parent.add(m);return m}\nconst rbox=(w,h,d)=>new THREE.BoxGeometry(w,h,d);\nconst V=(x,y,z)=>new THREE.Vector3(x,y,z);\nconst FX=[];const TICK=[];\n\n/* ---------- sky + sun ---------- */\nconst sunDir=new THREE.Vector3(...CFG.sun.dir).normalize();\nconst SK=CFG.sky||{hor:[.86,.93,.96],zen:[.42,.66,.88],glow:[1,.93,.8],clouds:.45};\nconst sky=new THREE.Mesh(new THREE.SphereGeometry(150,16,10),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,\n  uniforms:{sun:{value:sunDir}},\n  vertexShader:`varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,\n  fragmentShader:`varying vec3 vD;uniform vec3 sun;void main(){float h=clamp(vD.y,0.,1.);vec3 hor=vec3(${SK.hor}),zen=vec3(${SK.zen});\n   vec3 c=mix(hor,zen,pow(h,.55));float s=max(dot(normalize(vD),sun),0.);c+=vec3(${SK.glow})*(pow(s,8.)*.35+pow(s,200.)*1.5);\n   float cl=smoothstep(.55,.9,sin(vD.x*9.+vD.z*4.)*.5+.5+sin(vD.z*13.-vD.x*3.)*.25)*smoothstep(.05,.25,h)*
